version: '3.4'

# Docker keeps at most 5 files of 20 MB (100 MB) of stdout/stderr per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  object_effects:
    logging: *default-logging
    image: object_effects
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env.development
    ports:
      - "8080:80"
      - "9464:9464"
    networks:
      - localnet

networks:
  localnet:
    external: true
